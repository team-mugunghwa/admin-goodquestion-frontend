# 코드 스타일 논쟁을 없애기 위한 규칙.
# CI 가 `flutter analyze --fatal-infos` 로 검사하므로, 여기 걸린 건 머지가 막힙니다.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # 규칙 위반을 경고가 아니라 에러로 승격 - 쌓이기 전에 잡습니다
    always_declare_return_types: error
    avoid_print: error
    prefer_const_constructors: warning
    unused_import: error
    unused_local_variable: error
    # 생성 코드는 검사하지 않습니다
    invalid_annotation_target: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # --- 성능 ---
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true

    # --- 안정성 ---
    avoid_print: true # debugPrint 를 쓰세요
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    close_sinks: true
    use_build_context_synchronously: true # await 뒤 context 사용 시 mounted 확인

    # --- 가독성 ---
    always_declare_return_types: true
    prefer_single_quotes: true
    require_trailing_commas: true
    directives_ordering: true
    sort_child_properties_last: true
    unnecessary_lambdas: true
    unawaited_futures: true

    # --- 팀 규칙 ---
    # 생성자에서 private 필드를 이름 있는 매개변수로 받습니다. 이름 있는 매개변수는
    # 밑줄로 시작할 수 없어(Dart 문법) 초기화 형식 매개변수를 쓸 수 없는데, 이 규칙은
    # 그 경우를 구분하지 못하고 매번 걸립니다. ViewModel 이 UseCase 를 서너 개씩
    # 받는 구조라 해당 자리가 많아 규칙 자체를 끕니다.
    prefer_initializing_formals: false
    # 공개 API 에 타입을 명시해 리뷰어가 추론하지 않아도 되게 합니다
    type_annotate_public_apis: true
    # 위젯 생성자에 key 를 빠뜨리지 않기
    use_key_in_widget_constructors: true
